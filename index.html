<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>送り管理システム</title>
    <scrip<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rose送り管理システム</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.4/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        @media print {
            .no-print { display: none !important; }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        function App() {
            // ログイン認証状態
            const [isLoggedIn, setIsLoggedIn] = useState(false);
            const [currentStaffId, setCurrentStaffId] = useState('');
            const [currentStaffName, setCurrentStaffName] = useState('');
            const [isAdmin, setIsAdmin] = useState(false);
            const [mainTab, setMainTab] = useState('staffs'); 

            // ログインフォーム状態
            const [loginStaffId, setLoginStaffId] = useState('');
            const [loginPassword, setLoginPassword] = useState('');
            const [showPassword, setShowPassword] = useState(false);
            const [loginError, setLoginError] = useState('');
            const [loginLoading, setLoginLoading] = useState(false);

            // アラートメッセージ状態
            const [successMsg, setSuccessMsg] = useState('');
            const [errorMsg, setErrorMsg] = useState('');

            const [staffAccounts, setStaffAccounts] = useState({});

            const [customers, setCustomers] = useState([]);
            const [dropRecords, setDropRecords] = useState({});

            // 検索・フィルターステート
            const [searchCustQuery, setSearchCustQuery] = useState('');

            // 送り入力フォーム用状態
            const [inputDate, setInputDate] = useState(new Date().toISOString().split('T')[0]);
            const [inputTime, setInputTime] = useState('21:00');
            const [inputCustId, setInputCustId] = useState('');

            // 担当者編集・登録フォーム状態
            const [newStaffIdInput, setNewStaffIdInput] = useState('');
            const [newStaffNameInput, setNewStaffNameInput] = useState('');
            const [newStaffPasswordInput, setNewStaffPasswordInput] = useState('');
            const [editingStaffId, setEditingStaffId] = useState(null);
            const [submittingStaff, setSubmittingStaff] = useState(false);

            // お客様編集・登録フォーム状態
            const [newCustName, setNewCustName] = useState('');
            const [newCustLocation, setNewCustLocation] = useState('');
            const [editingCustId, setEditingCustId] = useState(null);

            // スケジュール年月選択
            const now = new Date();
            const [selectedYear, setSelectedYear] = useState(now.getFullYear());
            const [selectedMonth, setSelectedMonth] = useState(now.getMonth() + 1);
            const [selectedTargetStaffId, setSelectedTargetStaffId] = useState('');

            // 汎用モーダルダイアログ
            const [deleteModal, setDeleteModal] = useState({ show: false, type: '', id: '', name: '' });
            const [backupModal, setBackupModal] = useState(false);

            useEffect(() => {
                const savedStaff = localStorage.getItem('station_staff_accounts');
                if (savedStaff) {
                    try { 
                        const parsed = JSON.parse(savedStaff);
                        setStaffAccounts(parsed); 
                    } catch(e){ console.error(e); }
                }

                const savedCust = localStorage.getItem('station_customers');
                if (savedCust) {
                    try { setCustomers(JSON.parse(savedCust)); } catch(e){ console.error(e); }
                }
                const savedDrops = localStorage.getItem('station_drop_records');
                if (savedDrops) {
                    try { setDropRecords(JSON.parse(savedDrops)); } catch(e){ console.error(e); }
                }
            }, []);

            // 通知メッセージの自動消去
            useEffect(() => {
                if (successMsg) {
                    const timer = setTimeout(() => { setSuccessMsg(""); }, 3500);
                    return () => clearTimeout(timer);
                }
            }, [successMsg]);

            const saveStaffAccountsToStorage = (newAccounts) => {
                setStaffAccounts(newAccounts);
                localStorage.setItem('station_staff_accounts', JSON.stringify(newAccounts));
            };

            const saveCustomersToStorage = (newList) => {
                setCustomers(newList);
                localStorage.setItem('station_customers', JSON.stringify(newList));
            };

            const saveDropRecordsToStorage = (newRecords) => {
                setDropRecords(newRecords);
                localStorage.setItem('station_drop_records', JSON.stringify(newRecords));
            };

            const handleLogin = (e) => {
                e.preventDefault();
                setLoginError('');
                setLoginLoading(true);

                const sId = loginStaffId.trim();
                const sPwd = loginPassword.trim();

                setTimeout(() => {
                    let updatedAccounts = { ...staffAccounts };

                    // adminが初期未登録の場合、入力されたパスワードで登録
                    if (sId === 'admin' && !updatedAccounts['admin']) {
                        updatedAccounts['admin'] = { name: '管理者', password: sPwd };
                        saveStaffAccountsToStorage(updatedAccounts);
                    }

                    if (updatedAccounts[sId] && updatedAccounts[sId].password === sPwd) {
                        setIsLoggedIn(true);
                        setCurrentStaffId(sId);
                        setCurrentStaffName(updatedAccounts[sId].name);
                        const isA = sId === 'admin';
                        setIsAdmin(isA);
                        setMainTab(isA ? 'staffs' : 'customers');
                        setSuccessMsg(`${updatedAccounts[sId].name}さん、おかえりなさい。`);
                        setLoginStaffId('');
                        setLoginPassword('');
                    } else {
                        setLoginError('ログインIDまたはパスワードが正しくありません。');
                    }
                    setLoginLoading(false);
                }, 300);
            };

            const handleLogout = () => {
                setIsLoggedIn(false);
                setCurrentStaffId('');
                setCurrentStaffName('');
                setIsAdmin(false);
                setSuccessMsg('');
                setErrorMsg('');
            };

            const handleCreateStaff = (e) => {
                e.preventDefault();
                setErrorMsg('');

                const sId = newStaffIdInput.trim();
                const sName = newStaffNameInput.trim();
                const sPwd = newStaffPasswordInput.trim();

                if (!sId || !sName || !sPwd) {
                    setErrorMsg('すべての項目を入力してください。');
                    return;
                }

                setSubmittingStaff(true);
                if (!editingStaffId && staffAccounts[sId]) {
                    setErrorMsg(`入力した担当者ID「${sId}」は既に登録されています。`);
                    setSubmittingStaff(false);
                    return;
                }

                const updated = { ...staffAccounts };
                if (editingStaffId && editingStaffId !== sId) {
                    delete updated[editingStaffId];
                }
                updated[sId] = { name: sName, password: sPwd };

                saveStaffAccountsToStorage(updated);
                setSuccessMsg(`担当者「${sName}」の情報を保存しました。`);
                setNewStaffIdInput('');
                setNewStaffNameInput('');
                setNewStaffPasswordInput('');
                setEditingStaffId(null);
                setSubmittingStaff(false);
            };

            const handleEditStaff = (id) => {
                setNewStaffIdInput(id);
                setNewStaffNameInput(staffAccounts[id].name);
                setNewStaffPasswordInput(staffAccounts[id].password || '');
                setEditingStaffId(id);
                setErrorMsg('');
            };

            const handleSaveCustomer = (e) => {
                e.preventDefault();
                setErrorMsg('');

                const name = newCustName.trim();
                const location = newCustLocation.trim();
                if (!name || !location) {
                    setErrorMsg('お客様名と場所を入力してください。');
                    return;
                }

                let newList = [...customers];
                if (editingCustId) {
                    newList = newList.map(c => c.id === editingCustId ? { ...c, name, location } : c);
                    setSuccessMsg(`送り先「${name}」の情報更新が完了しました。`);
                    setEditingCustId(null);
                } else {
                    const newCust = { id: 'cust_' + Date.now(), name, location };
                    newList.push(newCust);
                    setSuccessMsg(`送り先「${name}」を追加登録しました。`);
                }

                saveCustomersToStorage(newList);
                setNewCustName('');
                setNewCustLocation('');
            };

            const handleEditCustomer = (cust) => {
                setNewCustName(cust.name);
                setNewCustLocation(cust.location);
                setEditingCustId(cust.id);
                setErrorMsg('');
            };

            const handleAddDropRecord = (e) => {
                e.preventDefault();
                setErrorMsg('');

                if (!inputDate || !inputTime || !inputCustId) {
                    setErrorMsg('日付、時刻、送り先をすべて選択・入力してください。');
                    return;
                }

                const cust = customers.find(c => c.id === inputCustId);
                const custName = cust ? cust.name : 'お客様';
                const custLocation = cust ? cust.location : '';
                const fullCustName = cust ? `${cust.name} (${cust.location})` : custName;

                // 同日に同じ送り先がすでに登録されているか判定
                const isDuplicate = Object.values(dropRecords).some(rec => 
                    rec && rec.staffId === currentStaffId && rec.date === inputDate && rec.customerId === inputCustId
                );

                if (isDuplicate) {
                    setErrorMsg(`${fullCustName}はすでに登録されています`);
                    return;
                }

                const recordId = 'drop_' + Date.now();
                const newRecord = {
                    id: recordId,
                    staffId: currentStaffId,
                    date: inputDate,
                    time: inputTime,
                    customerId: inputCustId,
                    customerName: custName,
                    customerLocation: custLocation
                };

                const newRecords = { ...dropRecords, [recordId]: newRecord };
                saveDropRecordsToStorage(newRecords);
                setSuccessMsg(`「${fullCustName}」の送り（${inputDate} ${inputTime}）を記録しました。`);
            };

            const handleDeleteDropRecord = (recordId) => {
                const newRecords = { ...dropRecords };
                delete newRecords[recordId];
                saveDropRecordsToStorage(newRecords);
                setSuccessMsg('送り記録を削除しました。');
            };

            const handleExportData = () => {
                const exportObj = {
                    staffAccounts,
                    customers,
                    dropRecords,
                    exportDate: new Date().toISOString()
                };
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(exportObj, null, 2));
                const downloadAnchor = document.createElement('a');
                downloadAnchor.setAttribute("href", dataStr);
                downloadAnchor.setAttribute("download", `送り管理システム_バックアップ_${new Date().toISOString().split('T')[0]}.json`);
                document.body.appendChild(downloadAnchor);
                downloadAnchor.click();
                downloadAnchor.remove();
            };

            const handleImportData = (e) => {
                const fileReader = new FileReader();
                if (e.target.files && e.target.files[0]) {
                    fileReader.readAsText(e.target.files[0], "UTF-8");
                    fileReader.onload = (event) => {
                        try {
                            const parsed = JSON.parse(event.target.result);
                            if (parsed.staffAccounts) saveStaffAccountsToStorage(parsed.staffAccounts);
                            if (parsed.customers) saveCustomersToStorage(parsed.customers);
                            if (parsed.dropRecords) saveDropRecordsToStorage(parsed.dropRecords);
                            setSuccessMsg('バックアップデータを正常に復元しました！');
                            setBackupModal(false);
                        } catch (err) {
                            setErrorMsg('ファイルの読み込みに失敗しました。正しいJSON形式を選択してください。');
                        }
                    };
                }
            };

            // スケジュール計算用ヘルパー
            const daysInMonth = new Date(selectedYear, selectedMonth, 0).getDate();

            const getDayOfWeekStr = (year, month, day) => {
                const days = ['日', '月', '火', '水', '木', '金', '土'];
                const d = new Date(year, month - 1, day);
                return days[d.getDay()];
            };

            const handleExportPDF = (elementId, filename) => {
                const element = document.getElementById(elementId);
                if (!element) return;
                const opt = {
                    margin: 5,
                    filename: filename + '.pdf',
                    image: { type: 'jpeg', quality: 0.98 },
                    html2canvas: { scale: 2, useCORS: true },
                    jsPDF: { unit: 'mm', format: 'a4', orientation: 'landscape' }
                };
                html2pdf().from(element).set(opt).save();
            };

            const filteredCustomers = useMemo(() => {
                if (!searchCustQuery.trim()) return customers;
                return customers.filter(c => 
                    c.name.toLowerCase().includes(searchCustQuery.toLowerCase()) || 
                    c.location.toLowerCase().includes(searchCustQuery.toLowerCase())
                );
            }, [customers, searchCustQuery]);

            if (!isLoggedIn) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-gradient-to-br from-indigo-100 via-sky-50 to-emerald-100 p-4">
                        <div className="bg-white/90 backdrop-blur-md rounded-2xl shadow-2xl w-full max-w-md p-8 border border-white/50">
                            <div className="text-center mb-8">
                                <h1 className="text-2xl font-bold text-slate-900 tracking-tight">Rose送り管理システム</h1>
                                <p className="text-xs text-slate-500 mt-2">
                                    ログインIDとパスワードを入力してください
                                </p>
                            </div>

                            {loginError && (
                                <div className="mb-6 p-4 bg-rose-50 border-l-4 border-rose-500 text-rose-700 text-xs rounded-r-lg shadow-sm">
                                    {loginError}
                                </div>
                            )}

                            <form onSubmit={handleLogin} className="space-y-5">
                                <div>
                                    <label className="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-2">ログインID</label>
                                    <input 
                                        type="text" 
                                        value={loginStaffId}
                                        onChange={(e) => setLoginStaffId(e.target.value)}
                                        placeholder="ログインIDを入力" 
                                        className="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-colors text-sm bg-white"
                                        required
                                    />
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-2">パスワード</label>
                                    <div className="relative">
                                        <input 
                                            type={showPassword ? "text" : "password"} 
                                            value={loginPassword}
                                            onChange={(e) => setLoginPassword(e.target.value)}
                                            placeholder="パスワードを入力" 
                                            className="w-full pl-4 pr-12 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-colors text-sm bg-white"
                                            required
                                        />
                                        <button 
                                            type="button"
                                            onClick={() => setShowPassword(!showPassword)}
                                            className="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600 focus:outline-none text-xs"
                                        >
                                            {showPassword ? "非表示" : "表示"}
                                        </button>
                                    </div>
                                </div>

                                <button 
                                    type="submit" 
                                    disabled={loginLoading}
                                    className="w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white font-semibold rounded-xl shadow-lg shadow-indigo-200 transition-all text-sm flex items-center justify-center space-x-2"
                                >
                                    {loginLoading ? <span>ログイン中...</span> : <span>ログイン</span>}
                                </button>
                            </form>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-slate-50 flex flex-col">
                    {/* ナビゲーションヘッダー */}
                    <header className="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                            <div className="flex items-center space-x-3">
                                <div>
                                    <h1 className="text-base font-bold text-slate-900 leading-none">Rose送り管理システム</h1>
                                    <p className="text-xs text-slate-500 mt-1">
                                        {currentStaffName} さん {isAdmin && <span className="ml-1 text-indigo-600 font-semibold">(管理者権限)</span>}
                                    </p>
                                </div>
                            </div>
                            <div className="flex items-center space-x-2">
                                <button
                                    onClick={() => setBackupModal(true)}
                                    className="px-3 py-1.5 text-xs font-medium text-slate-600 hover:text-indigo-600 bg-slate-100 hover:bg-indigo-50 rounded-lg transition-colors border border-slate-200"
                                >
                                    データバックアップ
                                </button>
                                <button 
                                    onClick={handleLogout}
                                    className="px-3 py-1.5 text-xs font-medium text-rose-600 hover:bg-rose-50 rounded-lg transition-colors border border-rose-200"
                                >
                                    ログアウト
                                </button>
                            </div>
                        </div>
                    </header>

                    {/* タブメニュー */}
                    <div className="bg-white border-b border-slate-200 shadow-sm">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex space-x-4 overflow-x-auto">
                            {isAdmin ? (
                                <div className="flex space-x-2 py-2">
                                    <button 
                                        onClick={() => { setMainTab('staffs'); setErrorMsg(''); setSuccessMsg(''); }}
                                        className={`py-2 px-4 rounded-xl text-xs font-bold transition-all ${mainTab === 'staffs' ? 'bg-indigo-600 text-white shadow-sm' : 'text-slate-600 hover:bg-slate-100'}`}
                                    >
                                        担当者アカウント管理
                                    </button>
                                    <button 
                                        onClick={() => { setMainTab('admin_schedule'); setErrorMsg(''); setSuccessMsg(''); }}
                                        className={`py-2 px-4 rounded-xl text-xs font-bold transition-all ${mainTab === 'admin_schedule' ? 'bg-indigo-600 text-white shadow-sm' : 'text-slate-600 hover:bg-slate-100'}`}
                                    >
                                        送り一覧（担当者別）
                                    </button>
                                </div>
                            ) : (
                                <div className="flex space-x-2 py-2">
                                    <button 
                                        onClick={() => { setMainTab('customers'); setErrorMsg(''); setSuccessMsg(''); }}
                                        className={`py-2 px-4 rounded-xl text-xs font-bold transition-all ${mainTab === 'customers' ? 'bg-indigo-600 text-white shadow-sm' : 'text-slate-600 hover:bg-slate-100'}`}
                                    >
                                        送り先管理
                                    </button>
                                    <button 
                                        onClick={() => { setMainTab('input'); setErrorMsg(''); setSuccessMsg(''); }}
                                        className={`py-2 px-4 rounded-xl text-xs font-bold transition-all ${mainTab === 'input' ? 'bg-indigo-600 text-white shadow-sm' : 'text-slate-600 hover:bg-slate-100'}`}
                                    >
                                        送り入力・管理
                                    </button>
                                    <button 
                                        onClick={() => { setMainTab('schedule'); setErrorMsg(''); setSuccessMsg(''); }}
                                        className={`py-2 px-4 rounded-xl text-xs font-bold transition-all ${mainTab === 'schedule' ? 'bg-indigo-600 text-white shadow-sm' : 'text-slate-600 hover:bg-slate-100'}`}
                                    >
                                        送り一覧
                                    </button>
                                </div>
                            )}
                        </div>
                    </div>

                    <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-1 w-full">
                        {/* 通知メッセージ */}
                        {successMsg && (
                            <div className="mb-6 p-4 bg-emerald-50 border-l-4 border-emerald-500 text-emerald-800 text-xs rounded-r-xl shadow-sm flex items-center justify-between">
                                <span>{successMsg}</span>
                                <button onClick={() => setSuccessMsg('')} className="text-emerald-600 font-bold hover:text-emerald-900">✕</button>
                            </div>
                        )}
                        {errorMsg && (
                            <div className="mb-6 p-4 bg-rose-50 border-l-4 border-rose-500 text-rose-800 text-xs rounded-r-xl shadow-sm flex items-center justify-between">
                                <span>{errorMsg}</span>
                                <button onClick={() => setErrorMsg('')} className="text-rose-600 font-bold hover:text-rose-900">✕</button>
                            </div>
                        )}

                        {/* 管理者：担当者アカウント管理 */}
                        {isAdmin && mainTab === 'staffs' && (
                            <div className="space-y-6">
                                <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                                    <h2 className="text-base font-bold text-slate-900 mb-4">{editingStaffId ? '担当者情報の編集' : '新規担当者アカウント登録'}</h2>
                                    <form onSubmit={handleCreateStaff} className="grid grid-cols-1 sm:grid-cols-3 gap-4 items-end">
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">ログインID</label>
                                            <input 
                                                type="text" 
                                                value={newStaffIdInput} 
                                                onChange={(e) => setNewStaffIdInput(e.target.value)} 
                                                placeholder="例: tanaka" 
                                                className="w-full px-3.5 py-2 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 text-xs bg-white"
                                                required 
                                                disabled={!!editingStaffId} 
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">担当者氏名</label>
                                            <input 
                                                type="text" 
                                                value={newStaffNameInput} 
                                                onChange={(e) => setNewStaffNameInput(e.target.value)} 
                                                placeholder="例: 田中" 
                                                className="w-full px-3.5 py-2 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 text-xs bg-white"
                                                required 
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">パスワード</label>
                                            <input 
                                                type="password" 
                                                value={newStaffPasswordInput} 
                                                onChange={(e) => setNewStaffPasswordInput(e.target.value)} 
                                                placeholder="パスワードを入力" 
                                                className="w-full px-3.5 py-2 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 text-xs bg-white"
                                                required 
                                            />
                                        </div>
                                        <div className="sm:col-span-3 flex space-x-3">
                                            <button 
                                                type="submit" 
                                                disabled={submittingStaff} 
                                                className="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl text-xs shadow-md transition-all"
                                            >
                                                {editingStaffId ? '更新する' : '登録する'}
                                            </button>
                                            {editingStaffId && (
                                                <button 
                                                    type="button" 
                                                    onClick={() => { setEditingStaffId(null); setNewStaffIdInput(''); setNewStaffNameInput(''); setNewStaffPasswordInput(''); }} 
                                                    className="px-5 py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 font-semibold rounded-xl text-xs transition-colors"
                                                >
                                                    キャンセル
                                                </button>
                                            )}
                                        </div>
                                    </form>
                                </div>

                                <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                                    <div className="px-6 py-4 border-b border-slate-100 flex justify-between items-center">
                                        <h3 className="text-sm font-bold text-slate-900">登録済み担当者一覧 ({Object.keys(staffAccounts).length}名)</h3>

                                <h3 className="text-base font-bold text-slate-900">確認</h3>
                                <p className="text-xs text-slate-600">
                                    {deleteModal.type === 'staff' 
                                        ? `担当者「${deleteModal.name}」のアカウントを削除しますか？`
                                        : `送り先「${deleteModal.name}」をリストから削除しますか？`}
                                </p>
                                <div className="flex space-x-3 pt-2">
                                    <button 
                                        onClick={() => {
                                            if (deleteModal.type === 'staff') {
                                                const updated = { ...staffAccounts };
                                                delete updated[deleteModal.id];
                                                saveStaffAccountsToStorage(updated);
                                                setSuccessMsg(`担当者「${deleteModal.name}」を削除しました。`);
                                            } else if (deleteModal.type === 'customer') {
                                                const newList = customers.filter(c => c.id !== deleteModal.id);
                                                saveCustomersToStorage(newList);
                                                setSuccessMsg(`送り先「${deleteModal.name}」を削除しました。`);
                                            }
                                            setDeleteModal({ show: false, type: '', id: '', name: '' });
                                        }}
                                        className="flex-1 py-2 bg-rose-600 hover:bg-rose-700 text-white font-semibold rounded-xl text-xs transition-colors"
                                    >
                                        削除する
                                    </button>
                                    <button 
                                        onClick={() => setDeleteModal({ show: false, type: '', id: '', name: '' })}
                                        className="flex-1 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold rounded-xl text-xs transition-colors"
                                    >
                                        キャンセル
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* バックアップダイアログ */}
                    {backupModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/40 backdrop-blur-sm p-4">
                            <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl space-y-5">
                                <h3 className="text-base font-bold text-slate-900">データのバックアップ・復元</h3>
                                <div className="space-y-3">
                                    <div className="p-4 bg-slate-50 rounded-xl border border-slate-200">
                                        <p className="text-xs font-bold text-slate-700 mb-1">1. データの保存 (エクスポート)</p>
                                        <p className="text-[11px] text-slate-500 mb-3">現在のデータ（担当者、送り先、送り記録）をファイルとして保存します。</p>
                                        <button 
                                            onClick={handleExportData}
                                            className="w-full py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl text-xs transition-colors"
                                        >
                                            バックアップファイルをダウンロード
                                        </button>
                                    </div>

                                    <div className="p-4 bg-slate-50 rounded-xl border border-slate-200">
                                        <p className="text-xs font-bold text-slate-700 mb-1">2. データの復元 (インポート)</p>
                                        <p className="text-[11px] text-slate-500 mb-3">保存したバックアップJSONファイルを選択してデータを上書き復元します。</p>
                                        <input 
                                            type="file" 
                                            accept=".json"
                                            onChange={handleImportData}
                                            className="block w-full text-xs text-slate-500 file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100"
                                        />
                                    </div>
                                </div>

                                <div className="text-right pt-2">
                                    <button 
                                        onClick={() => setBackupModal(false)}
                                        className="px-5 py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 font-semibold rounded-xl text-xs transition-colors"
                                    >
                                        閉じる
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/6.26.0/babel.min.js"></script>

</head>
<body class="bg-gray-50 text-gray-800 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            // 状態管理
            const [isLoggedIn, setIsLoggedIn] = useState(false);
            const [currentStaffId, setCurrentStaffId] = useState('');
            const [currentStaffName, setCurrentStaffName] = useState('');
            const [isAdmin, setIsAdmin] = useState(false);
            const [mainTab, setMainTab] = useState('staffs'); // 'staffs' | 'admin_schedule' | 'customers' | 'input' | 'schedule'

            // ログインフォーム状態
            const [loginStaffId, setLoginStaffId] = useState('');
            const [loginPassword, setLoginPassword] = useState('');
            const [showPassword, setShowPassword] = useState(false);
            const [loginError, setLoginError] = useState('');
            const [loginLoading, setLoginLoading] = useState(false);

            // メッセージ状態
            const [successMsg, setSuccessMsg] = useState('');
            const [errorMsg, setErrorMsg] = useState('');

            // デフォルトの初期アカウント
            const defaultStaffAccounts = {
                'admin': { name: '管理者', password: 'password123' },
                'yamada': { name: '山田', password: 'password123' },
                'ohtaki': { name: '大滝', password: 'password123' }
            };

            const [staffAccounts, setStaffAccounts] = useState(defaultStaffAccounts);

            const [customers, setCustomers] = useState([
                { id: 'cust_1', name: 'ろぜ', location: '銀座' }
            ]);

            const [dropRecords, setDropRecords] = useState({});

            // 送り入力フォーム用状態
            const [inputDate, setInputDate] = useState(new Date().toISOString().split('T')[0]);
            const [inputTime, setInputTime] = useState('21:00');
            const [inputCustId, setInputCustId] = useState('');

            // 編集・登録用入力値
            const [newStaffIdInput, setNewStaffIdInput] = useState('');
            const [newStaffNameInput, setNewStaffNameInput] = useState('');
            const [newStaffPasswordInput, setNewStaffPasswordInput] = useState('');
            const [editingStaffId, setEditingStaffId] = useState(null);
            const [submittingStaff, setSubmittingStaff] = useState(false);

            const [newCustName, setNewCustName] = useState('ろぜ');
            const [newCustLocation, setNewCustLocation] = useState('銀座');
            const [editingCustId, setEditingCustId] = useState(null);

            // スケジュール表示用
            const now = new Date();
            const [selectedYear, setSelectedYear] = useState(now.getFullYear());
            const [selectedMonth, setSelectedMonth] = useState(now.getMonth() + 1);
            const [selectedTargetStaffId, setSelectedTargetStaffId] = useState('');

            // 削除モーダル
            const [deleteModal, setDeleteModal] = useState({ show: false, type: '', id: '', name: '' });

            useEffect(() => {
                const savedStaff = localStorage.getItem('station_staff_accounts');
                if (savedStaff) {
                    try { 
                        const parsed = JSON.parse(savedStaff);
                        setStaffAccounts({ ...defaultStaffAccounts, ...parsed }); 
                    } catch(e){}
                } else {
                    localStorage.setItem('station_staff_accounts', JSON.stringify(defaultStaffAccounts));
                }

                const savedCust = localStorage.getItem('station_customers');
                if (savedCust) {
                    try { setCustomers(JSON.parse(savedCust)); } catch(e){}
                }
                const savedDrops = localStorage.getItem('station_drop_records');
                if (savedDrops) {
                    try { setDropRecords(JSON.parse(savedDrops)); } catch(e){}
                }
            }, []);

            // 成功メッセージの自動消去（3秒）
            useEffect(() => {
                if (successMsg) {
                    const timer = setTimeout(() => { setSuccessMsg(""); }, 3000);
                    return () => clearTimeout(timer);
                }
            }, [successMsg]);

            // データの永続化
            const saveStaffAccountsToStorage = (newAccounts) => {
                setStaffAccounts(newAccounts);
                localStorage.setItem('station_staff_accounts', JSON.stringify(newAccounts));
            };

            const saveCustomersToStorage = (newList) => {
                setCustomers(newList);
                localStorage.setItem('station_customers', JSON.stringify(newList));
            };

            const saveDropRecordsToStorage = (newRecords) => {
                setDropRecords(newRecords);
                localStorage.setItem('station_drop_records', JSON.stringify(newRecords));
            };

            const handleLogin = (e) => {
                e.preventDefault();
                setLoginError('');
                setLoginLoading(true);
                setSuccessMsg('');
                setErrorMsg('');

                const sId = loginStaffId.trim();
                const sPwd = loginPassword.trim();

                setTimeout(() => {
                    if (staffAccounts[sId] && staffAccounts[sId].password === sPwd) {
                        setIsLoggedIn(true);
                        setCurrentStaffId(sId);
                        setCurrentStaffName(staffAccounts[sId].name);
                        const isA = sId === 'admin';
                        setIsAdmin(isA);
                        setMainTab(isA ? 'staffs' : 'customers');
                        setSuccessMsg(`${staffAccounts[sId].name}さんとしてログインしました。`);
                        setLoginStaffId('');
                        setLoginPassword('');
                    } else {
                        setLoginError('担当者IDまたはパスワードが正しくありません。');
                    }
                    setLoginLoading(false);
                }, 300);
            };

            const handleLogout = () => {
                setIsLoggedIn(false);
                setCurrentStaffId('');
                setCurrentStaffName('');
                setIsAdmin(false);
                setSuccessMsg('');
                setErrorMsg('');
            };

            const handleCreateStaff = (e) => {
                e.preventDefault();
                setErrorMsg('');
                setSuccessMsg('');

                const sId = newStaffIdInput.trim();
                const sName = newStaffNameInput.trim();
                const sPwd = newStaffPasswordInput.trim();

                if (!sId || !sName || !sPwd) {
                    setErrorMsg('すべての項目を入力してください。');
                    return;
                }

                setSubmittingStaff(true);
                if (!editingStaffId && staffAccounts[sId]) {
                    setErrorMsg(`入力した担当者ID「${sId}」は既に登録されています。`);
                    setSubmittingStaff(false);
                    return;
                }

                const updated = { ...staffAccounts };
                if (editingStaffId && editingStaffId !== sId) {
                    delete updated[editingStaffId];
                }
                updated[sId] = { name: sName, password: sPwd };

                saveStaffAccountsToStorage(updated);
                setSuccessMsg(`担当者「${sName}」を登録しました！`);
                setNewStaffIdInput('');
                setNewStaffNameInput('');
                setNewStaffPasswordInput('');
                setEditingStaffId(null);
                setSubmittingStaff(false);
            };

            const handleEditStaff = (id) => {
                setNewStaffIdInput(id);
                setNewStaffNameInput(staffAccounts[id].name);
                setNewStaffPasswordInput(staffAccounts[id].password || '');
                setEditingStaffId(id);
                setErrorMsg('');
                setSuccessMsg('');
            };

            const handleCancelEditStaff = () => {
                setNewStaffIdInput('');
                setNewStaffNameInput('');
                setNewStaffPasswordInput('');
                setEditingStaffId(null);
                setErrorMsg('');
            };

            const handleSaveCustomer = (e) => {
                e.preventDefault();
                setErrorMsg('');
                setSuccessMsg('');

                const name = newCustName.trim();
                const location = newCustLocation.trim();
                if (!name || !location) {
                    setErrorMsg('お客様名と場所を入力してください。');
                    return;
                }

                let newList = [...customers];
                if (editingCustId) {
                    newList = newList.map(c => c.id === editingCustId ? { ...c, name, location } : c);
                    setSuccessMsg(`お客様「${name}」を更新しました！`);
                    setEditingCustId(null);
                } else {
                    const newCust = { id: 'cust_' + Date.now(), name, location };
                    newList.push(newCust);
                    setSuccessMsg(`お客様「${name}」を追加しました！`);
                }

                saveCustomersToStorage(newList);
                setNewCustName('ろぜ');
                setNewCustLocation('銀座');
            };

            const handleEditCustomer = (cust) => {
                setNewCustName(cust.name);
                setNewCustLocation(cust.location);
                setEditingCustId(cust.id);
                setErrorMsg('');
                setSuccessMsg('');
            };

            const handleAddDropRecord = (e) => {
                e.preventDefault();
                setErrorMsg('');
                setSuccessMsg('');

                if (!inputDate || !inputTime || !inputCustId) {
                    setErrorMsg('日付、時刻、お客様をすべて入力してください。');
                    return;
                }

                const cust = customers.find(c => c.id === inputCustId);
                const custName = cust ? cust.name : 'お客様';

                const recordId = 'drop_' + Date.now();
                const newRecord = {
                    id: recordId,
                    staffId: currentStaffId,
                    date: inputDate, // YYYY-MM-DD
                    time: inputTime, // HH:MM
                    customerId: inputCustId,
                    customerName: custName
                };

                const newRecords = { ...dropRecords, [recordId]: newRecord };
                saveDropRecordsToStorage(newRecords);
                setSuccessMsg(`「${custName}」の送り予定（${inputDate} ${inputTime}）を登録しました！`);
            };

            const handleDeleteDropRecord = (recordId) => {
                const newRecords = { ...dropRecords };
                delete newRecords[recordId];
                saveDropRecordsToStorage(newRecords);
                setSuccessMsg('送り記録を削除しました。');
            };

            // 日数・曜日計算
            const getDaysInMonth = (year, month) => new Date(year, month, 0).getDate();
            const daysInMonth = getDaysInMonth(selectedYear, selectedMonth);

            const getDayOfWeekStr = (year, month, day) => {
                const days = ['日', '月', '火', '水', '木', '金', '土'];
                const d = new Date(year, month - 1, day);
                return days[d.getDay()];
            };

            // PDF出力機能
            const handleExportPDF = (elementId, filename) => {
                const element = document.getElementById(elementId);
                if (!element) return;
                const opt = {
                    margin: 5,
                    filename: filename + '.pdf',
                    image: { type: 'jpeg', quality: 0.98 },
                    html2canvas: { scale: 2, useCORS: true },
                    jsPDF: { unit: 'mm', format: 'a4', orientation: 'landscape' }
                };
                setTimeout(() => {
                    html2pdf().from(element).set(opt).save();
                }, 100);
            };

            if (!isLoggedIn) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-gradient-to-br from-indigo-50 to-blue-100 p-4">
                        <div className="bg-white rounded-2xl shadow-xl w-full max-w-md p-8 border border-gray-100">
                            <div className="text-center mb-8">
                                <div className="inline-flex items-center justify-center w-16 h-16 bg-indigo-600 text-white rounded-2xl shadow-lg mb-4 text-2xl font-bold">
                                    送
                                </div>
                                <h1 className="text-2xl font-bold text-gray-900">送り管理システム</h1>
                                <p className="text-sm text-gray-500 mt-1">担当者IDとパスワードでログインしてください</p>
                            </div>

                            {loginError && (
                                <div className="mb-6 p-4 bg-red-50 border-l-4 border-red-500 text-red-700 text-sm rounded-r-lg">
                                    {loginError}
                                </div>
                            )}

                            <form onSubmit={handleLogin} className="space-y-5">
                                <div>
                                    <label className="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-2">担当者ID</label>
                                    <input 
                                        type="text" 
                                        inputMode="text"
                                        autoCapitalize="none"
                                        autoComplete="username"
                                        value={loginStaffId}
                                        onChange={(e) => setLoginStaffId(e.target.value)}
                                        placeholder="例: admin または yamada" 
                                        className="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-colors text-base sm:text-sm bg-white"
                                        required
                                    />
                                </div>
                                <div>
                                    <label className="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-2">パスワード</label>
                                    <div className="relative">
                                        <input 
                                            type={showPassword ? "text" : "password"} 
                                            autoComplete="current-password"
                                            value={loginPassword}
                                            onChange={(e) => setLoginPassword(e.target.value)}
                                            placeholder="パスワードを入力" 
                                            className="w-full pl-4 pr-12 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-colors text-base sm:text-sm bg-white"
                                            required
                                        />
                                        <button 
                                            type="button"
                                            onClick={() => setShowPassword(!showPassword)}
                                            className="absolute inset-y-0 right-0 pr-3.5 flex items-center text-gray-400 hover:text-gray-600 focus:outline-none"
                                            tabIndex="-1"
                                        >
                                            {showPassword ? (
                                                <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"></path></svg>
                                            ) : (
                                                <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                                            )}
                                        </button>
                                    </div>
                                </div>

                                <button 
                                    type="submit" 
                                    disabled={loginLoading}
                                    className="w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl shadow-lg shadow-indigo-200 transition-all text-base sm:text-sm flex items-center justify-center space-x-2"
                                >
                                    {loginLoading ? <span>ログイン中...</span> : <span>ログイン</span>}
                                </button>
                            </form>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-gray-50 flex flex-col">
                    {/* ヘッダー */}
                    <header className="bg-white border-b border-gray-200 sticky top-0 z-30">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                            <div className="flex items-center space-x-3">
                                <div className="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center text-white font-bold text-lg">
                                    送
                                </div>
                                <div>
                                    <h1 className="text-lg font-bold text-gray-900 leading-none">送り管理システム</h1>
                                    <p className="text-xs text-gray-500 mt-1">{currentStaffName} さんでログイン中 {isAdmin ? '(管理者)' : ''}</p>
                                </div>
                            </div>
                            <button 
                                onClick={handleLogout}
                                className="px-4 py-2 text-sm font-medium text-gray-700 hover:text-red-600 hover:bg-red-50 rounded-lg transition-colors border border-gray-200"
                            >
                                ログアウト
                            </button>
                        </div>
                    </header>

                    {/* タブナビゲーション */}
                    <div className="bg-white border-b border-gray-200 shadow-sm">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex space-x-4 overflow-x-auto">
                            {isAdmin ? (
                                <div className="flex space-x-4">
                                    <button 
                                        onClick={() => { setMainTab('staffs'); setErrorMsg(''); setSuccessMsg(''); }}
                                        className={`py-4 px-4 text-sm font-semibold border-b-2 whitespace-nowrap transition-colors ${mainTab === 'staffs' ? 'border-indigo-600 text-indigo-600' : 'border-transparent text-gray-500 hover:text-gray-700'}`}
                                    >
                                        担当者アカウント管理
                                    </button>
                                    <button 
                                        onClick={() => { setMainTab('admin_schedule'); setErrorMsg(''); setSuccessMsg(''); }}
                                        className={`py-4 px-4 text-sm font-semibold border-b-2 whitespace-nowrap transition-colors ${mainTab === 'admin_schedule' ? 'border-indigo-600 text-indigo-600' : 'border-transparent text-gray-500 hover:text-gray-700'}`}
                                    >
                                        送り一覧（担当者別）
                                    </button>
                                </div>
                            ) : (
                                <div className="flex space-x-4">
                                    <button 
                                        onClick={() => { setMainTab('customers'); setErrorMsg(''); setSuccessMsg(''); }}
                                        className={`py-4 px-4 text-sm font-semibold border-b-2 whitespace-nowrap transition-colors ${mainTab === 'customers' ? 'border-indigo-600 text-indigo-600' : 'border-transparent text-gray-500 hover:text-gray-700'}`}
                                    >
                                        お客様管理
                                    </button>
                                    <button 
                                        onClick={() => { setMainTab('input'); setErrorMsg(''); setSuccessMsg(''); }}
                                        className={`py-4 px-4 text-sm font-semibold border-b-2 whitespace-nowrap transition-colors ${mainTab === 'input' ? 'border-indigo-600 text-indigo-600' : 'border-transparent text-gray-500 hover:text-gray-700'}`}
                                    >
                                        送り管理（入力）
                                    </button>
                                    <button 
                                        onClick={() => { setMainTab('schedule'); setErrorMsg(''); setSuccessMsg(''); }}
                                        className={`py-4 px-4 text-sm font-semibold border-b-2 whitespace-nowrap transition-colors ${mainTab === 'schedule' ? 'border-indigo-600 text-indigo-600' : 'border-transparent text-gray-500 hover:text-gray-700'}`}
                                    >
                                        送りスケジュール一覧
                                    </button>
                                </div>
                            )}
                        </div>
                    </div>

                    {/* アラートメッセージ */}
                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-4 w-full">
                        {successMsg && (
                            <div className="p-4 bg-emerald-50 border-l-4 border-emerald-500 text-emerald-800 text-sm rounded-r-lg shadow-sm flex items-center justify-between">
                                <div className="flex items-center space-x-2">
                                    <svg className="w-5 h-5 text-emerald-600 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7"></path></svg>
                                    <span>{successMsg}</span>
                                </div>
                                <button onClick={() => setSuccessMsg('')} className="text-emerald-600 hover:text-emerald-800 font-bold">&times;</button>
                            </div>

                                                className="px-5 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-xl text-sm shadow-md transition-colors flex items-center space-x-2"
                                            >
                                                <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                                                <span>PDF出力</span>
                                            </button>
                                        );
                                    })()}
                                </div>

                                {selectedTargetStaffId ? (
                                    <div id="printable-admin-schedule-area" className="bg-white p-6 rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
                                        <div className="mb-4 flex items-baseline justify-between border-b border-gray-100 pb-4">
                                            <h2 className="text-xl font-bold text-gray-900">{staffAccounts[selectedTargetStaffId] ? staffAccounts[selectedTargetStaffId].name : selectedTargetStaffId}　{selectedMonth}月分</h2>
                                            <div className="text-xs text-gray-500">作成日: {new Date().toLocaleDateString()}</div>
                                        </div>
                                        <div className="overflow-x-auto">
                                            <table className="min-w-full divide-y divide-gray-200 border-collapse">
                                                <thead className="bg-gray-50">
                                                    <tr>
                                                        <th className="px-2 py-2 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider border-r border-gray-200 w-20">お客様</th>
                                                        <th className="px-2 py-2 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider border-r border-gray-200 w-16">場所</th>
                                                        {Array.from({length: daysInMonth}, (_, i) => i + 1).map(day => {
                                                            const dow = getDayOfWeekStr(selectedYear, selectedMonth, day);
                                                            const isWeekend = dow === '土' || dow === '日';
                                                            return (
                                                                <th key={day} className={`px-0.5 py-2 text-center text-xs font-semibold border-r border-gray-200 min-w-[36px] ${isWeekend ? 'bg-gray-200 text-red-600' : 'text-gray-600'}`}>
                                                                    <div>{day}</div>
                                                                    <div className="text-[9px] font-normal">({dow})</div>
                                                                </th>
                                                            );
                                                        })}
                                                    </tr>
                                                </thead>
                                                <tbody className="bg-white divide-y divide-gray-200">
                                                    {customers.map(cust => (
                                                        <tr key={cust.id} className="hover:bg-gray-50">
                                                            <td className="px-2 py-2 whitespace-nowrap text-xs font-bold text-gray-900 border-r border-gray-200 truncate max-w-[80px]" title={cust.name}>{cust.name}</td>
                                                            <td className="px-2 py-2 whitespace-nowrap text-xs text-gray-600 border-r border-gray-200 truncate max-w-[60px]" title={cust.location}>{cust.location}</td>
                                                            {Array.from({length: daysInMonth}, (_, i) => i + 1).map(day => {
                                                                const dow = getDayOfWeekStr(selectedYear, selectedMonth, day);
                                                                const isWeekend = dow === '土' || dow === '日';
                                                                const targetDateStr = `${selectedYear}-${String(selectedMonth).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                                                                const foundRecord = Object.values(dropRecords).find(rec => 
                                                                    rec && rec.staffId === selectedTargetStaffId && rec.customerId === cust.id && rec.date === targetDateStr
                                                                );
                                                                return (
                                                                    <td key={day} className={`px-0.5 py-2 text-center text-[10px] border-r border-gray-200 font-semibold ${isWeekend ? 'bg-gray-100' : ''} ${foundRecord ? 'text-indigo-600 bg-indigo-50' : 'text-gray-300'}`}>
                                                                        {foundRecord ? foundRecord.time : ''}
                                                                    </td>
                                                                );
                                                            })}
                                                        </tr>
                                                    ))}
                                                    {customers.length === 0 && (
                                                        <tr>
                                                            <td colSpan={daysInMonth + 2} className="px-6 py-6 text-center text-sm text-gray-400"></td>
                                                        </tr>
                                                    )}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                ) : (
                                    <div className="bg-white p-12 rounded-2xl shadow-sm border border-gray-200 text-center text-gray-500">
                                        上部のプルダウンから担当者を選択してください。
                                    </div>
                                )}
                            </div>
                        )}
                    </main>

                    {/* 削除確認モーダル */}
                    {deleteModal.show && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50 p-4">
                            <div className="bg-white rounded-2xl max-w-sm w-full p-6 shadow-xl space-y-4">
                                <h3 className="text-lg font-bold text-gray-900">削除の確認</h3>
                                <p className="text-sm text-gray-600">
                                    {deleteModal.type === 'staff' 
                                        ? `担当者「${deleteModal.name}」を削除してもよろしいですか？`
                                        : `お客様「${deleteModal.name}」を削除してもよろしいですか？`}
                                </p>
                                <div className="flex space-x-3 pt-2">
                                    <button 
                                        onClick={() => {
                                            if (deleteModal.type === 'staff') {
                                                const updated = { ...staffAccounts };
                                                delete updated[deleteModal.id];
                                                saveStaffAccountsToStorage(updated);
                                                setSuccessMsg(`担当者「${deleteModal.name}」を削除しました。`);
                                            } else if (deleteModal.type === 'customer') {
                                                const newList = customers.filter(c => c.id !== deleteModal.id);
                                                saveCustomersToStorage(newList);
                                                setSuccessMsg(`お客様「${deleteModal.name}」を削除しました。`);
                                            }
                                            setDeleteModal({ show: false, type: '', id: '', name: '' });
                                        }}
                                        className="flex-1 py-2.5 bg-red-600 hover:bg-red-700 text-white font-semibold rounded-xl text-sm transition-colors"
                                    >
                                        削除する
                                    </button>
                                    <button 
                                        onClick={() => setDeleteModal({ show: false, type: '', id: '', name: '' })}
                                        className="flex-1 py-2.5 bg-gray-200 hover:bg-gray-300 text-gray-700 font-semibold rounded-xl text-sm transition-colors"
                                    >
                                        キャンセル
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
